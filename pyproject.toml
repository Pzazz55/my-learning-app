[project]
name = "my-learning-app"
version = "0.1.0"
description = "A Streamlit education app for grade-aware multiple-choice exams, timed student sessions, local result storage, and parent review."
readme = "README.md"
authors = [
    { name = "Pzazz55", email = "Pzazz55@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "streamlit>=1.64.0",
    "streamlit-autorefresh>=1.0.1",
    "tzdata>=2024.1",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.100.0",
    "libsql-client>=0.3.0",
]
